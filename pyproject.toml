[tool.poetry]
authors = ["Dan Meshkov <daniil.meshkov@opensea.io>", "Vicky Gong <vicky.gong@opensea.io>"]
description = "Open-Rarity library is an open standard that provides an easy, explanable and reproducible computation for NFT rarity"
license = "Apache-2.0"
name = "open-rarity"
version = "1.0.0.dev0"

readme = "README.md"

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: English",
  "Typing :: Typed",
  "Topic :: Software Development :: Libraries",
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]

[tool.poetry.dependencies]
numpy = ">=2.5.5"
pydantic = ">=2.14.3,<3"
python = ">=3.12,<3.16"
requests = {version = ">=2.34.2", optional = true}

[tool.poetry.scripts]
openrarity = "open_rarity.cli:main"

[tool.poetry.extras]
opensea = ["requests"]

[tool.poetry.group.dev.dependencies]
mypy = "^2.4.1"
nox = ">=2026.10.20"
pre-commit = "^4.7.0"
pytest = "^9.2.0"
pytest-cov = "^7.1.0"
pytest-mock = "^3.17.0"
ruff = "^0.17.5"
types-requests = ">=2.33.0.20261030"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F401"] # Existing public re-exports in __init__.py

[tool.mypy]
implicit_optional = true # Remove after existing None defaults get explicit Optional types.

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=2.5.0"]

