[tool.poetry]
authors = ["Dan Meshkov <daniil.meshkov@opensea.io>", "Vicky Gong <vicky.gong@opensea.io>"]
description = "Open-Rarity library is an open standard that provides an easy, explanable and reproducible computation for NFT rarity"
license = "Apache-2.0"
name = "open-rarity"
version = "0.7.5"

readme = "README.md"

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: English",
  "Typing :: Typed",
  "Topic :: Software Development :: Libraries",
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[tool.poetry.dependencies]
numpy = ">=1.23.1"
pydantic = ">=1.10.27,<3"
python = ">=3.11,<3.14"
requests = {version = ">=2.28.1", optional = true}

[tool.poetry.extras]
opensea = ["requests"]

[tool.poetry.group.dev.dependencies]
mypy = "^2.4.1"
pre-commit = "^4.0.0"
pytest = "^9.2.0"
pytest-cov = "^7.0.0"
pytest-mock = "^3.10.0"
ruff = "^0.17.5"
types-requests = ">=2.28.6"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F401"] # Existing public re-exports in __init__.py

[tool.mypy]
implicit_optional = true # Remove after existing None defaults get explicit Optional types.

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=1.0.0"]

