name: OpenSea API smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'
      - run: python -m pip install -e '.[opensea]'
      - run: python -m scripts.check_opensea_api
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
