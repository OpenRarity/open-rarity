name: Unit tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: python -m pip install -e '.[opensea]' pytest pytest-mock
      - name: Unit tests
        run: python -m pytest -q
