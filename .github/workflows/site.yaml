name: Site preview
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --prefix typescript
      - run: npm run build --prefix typescript
      - run: npm ci --prefix site
      - run: npm run build --prefix site
      - run: npx --prefix site playwright install --with-deps chromium
      - run: npm test --prefix site
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: github-pages-preview
          path: site/dist
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: site-browser-evidence
          path: site/test-results
