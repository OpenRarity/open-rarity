name: Code quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install package and quality tools
        run: python -m pip install -e '.[opensea]' ruff==0.17.5 mypy==2.4.1
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy open_rarity
